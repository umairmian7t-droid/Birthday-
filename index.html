<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            background-color: #0f0f1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            width: 85%;
            max-width: 400px;
        }
        .fingerprint-box {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 30px auto;
            cursor: pointer;
        }
        .heart-icon {
            font-size: 80px;
            color: #ff2a6d;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .scan-line {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #00fff5;
            box-shadow: 0 0 15px #00fff5;
            animation: scan 1.5s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        #surpriseContent {
            display: none;
            margin-top: 20px;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { color: #ff2a6d; }
        p { font-size: 1.1rem; line-height: 1.6; color: #e0e0e0; }
    </style>
</head>
<body>

    <div class="container" id="scanSection">
        <h2>Touch & Scan to Unlock Surprise ❤️</h2>
        <div class="fingerprint-box" onclick="startScan()">
            <div class="scan-line" id="scanner"></div>
            <div class="heart-icon">❤️</div>
        </div>
        <p style="font-size: 0.9rem; color: #888;">Tap the heart to scan fingerprint</p>
    </div>

    <div class="container" id="surpriseContent">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Wishing you the happiest birthday filled with joy and smile!</p>
        <p>May your special day be as amazing as you are. ❤️</p>
    </div>

    <script>
        function startScan() {
            document.getElementById('scanner').style.display = 'block';
            setTimeout(() => {
                document.getElementById('scanSection').style.display = 'none';
                document.getElementById('surpriseContent').style.display = 'block';
            }, 2000);
        }
    </script>
</body>
</html>
